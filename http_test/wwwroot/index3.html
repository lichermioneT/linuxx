<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            color: #333;
        }

        p {
            color: #666;
        }

        .nav {
            margin: 30px 0;
        }

        .nav a {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 8px;
        }

        .nav a:hover {
            background-color: #45a049;
        }

        .images {
            margin: 40px auto;
            width: 80%;
        }

        .images img {
            width: 300px;
            height: auto;
            margin: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <h1>欢迎来到首页 index.html</h1>
    <p>这里可以进行页面跳转，也可以展示图片。</p>

    <div class="nav">
        <a href="./test/a.html">跳转到 A 页面</a>
        <a href="./test/b.html">跳转到 B 页面</a>
        <a href="./index1.html">跳转到 index1 页面</a>
    </div>

    <div class="images">
        <h2>图片展示</h2>
        <img src="./image/1.png" alt="图片1">
        <img src="./image/2.png" alt="图片2">
    </div>
</body>
</html>
